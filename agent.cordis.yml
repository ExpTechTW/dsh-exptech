# The `exptech` agent preset: the full coding agent themed for ExpTechTW.
#
# Based on the shipped `standard` preset (full coding agent) plus:
#   * an ExpTechTW persona (zh-TW-first responses, org-aware instructions);
#   * bundled skills `exptech-org` (organisation map & conventions) and
#     `exptech-apis` (usable public API endpoint catalog) under `skills/`.
# Keep the plane rule and the realm rule exactly as `standard`.
#
# This file is now the bundle's PATCH (`dsh.bundle.patch`), written in the
# Loader patch dialect: a top-level array of patch entries. It INSERTS one
# `preset-exptech` declaration row (`@deepseek-ai/dsh-agent-preset`) into the
# profile loader. The agent-preset registry mounts the declared `plugins` list
# ONCE under a standing scope; every session naming `exptech` joins by scope
# parentage, so the tools and prompt sections registered here cover each joined
# agent while a session's own state stays keyed per Session/Agent inside the
# plugins. The host composition (`base.cordis.yml` + `web.cordis.yml`) keeps
# everything a preset must not own: the registries themselves, the sandbox and
# approval stack, persistence, and the model route.
#
# ── placement notes (why each row lives here, not on the host) ───────────────
#
# * persona: `prefix` is the only identity slot this row accepts —
#   @deepseek-ai/dsh-persona requires it and knows prefix/suffix/complete/
#   includeRuntimeContext only. There is no `text` field — an unknown key is
#   dropped, so `text:` failed the mount with "invalid config: $.prefix missing
#   required value". `{{model}}` resolve from the agent's own
#   route and workspace.
#
# * tool-bash/-pwsh: `disabled` is a ROW option, not a config field — the shell
#   tools accept only `enableRunInBackground`, and an unknown config key is
#   dropped silently, leaving BOTH shell tools enabled on every platform. The
#   `!!js` gate is the row-level one. Their executors (`bash-sandbox`/
#   `pwsh-sandbox`) are host-plane, and `shell-env` stays in the HOST
#   composition: `apps/cli/src/web.ts` injects it to publish `DSH_WEB_URL`/
#   `DSH_WEB_MODE`, and a host row that injects a service is the criterion for
#   host-plane ownership — injection resolves before any session exists.
#
# * tool-jobs: only the model-facing controls live here. The task REGISTRY
#   stays on the host plane — its producers sit outside any realm this preset
#   could put it in, and an entry-local realm here is invisible to every
#   sibling row, so `run_in_background` would answer "background jobs
#   unavailable" while these controls sat in the catalog. The registry is keyed
#   by owning agent anyway, so one host instance serves every session.
#
# * skill-filesystem: contributes local-root discovery for agents on this
#   preset, adding any `SKILL.md` found in the preset's `skills/` directory to
#   the available skills list. `customSkillDirs` takes filesystem paths, and a
#   bare `new URL('skills/', baseUrl)` does NOT find them: `baseUrl` is the
#   PROFILE root (the directory of the profile's `cordis.yml`), not this patch's
#   directory, so that form resolves to `<profile>/skills/`. Follow the shipped
#   `cordis` preset instead — resolve this package by name from `baseUrl` with
#   `createRequire` and take `skills/` beside its `package.json`, which is
#   exactly where the bundle is installed into the profile's `node_modules`.
#
# * goals: the goal SERVICE, its session driver, and the Gateway's Remote
#   endpoints stay on the host plane — the Gateway serves the goal domain
#   through a generated descriptor, so it resolves `goals` on the host and an
#   entry-local realm here would hide it. The registry is keyed by session
#   anyway, so one host instance serves every session. A preset only chooses
#   whether its agent gets the human command and the model-facing tool — both
#   register into this preset's scoped layers, exactly as in `standard`.
#
# * plan mode: plan state is per-agent by nature, so an entry-local realm is
#   not a workaround here — it is the correct lifetime.
#
# * compaction: `tokenMeter` stays on the HOST plane (one instance keyed by
#   Session, whose units the browser reads for every session — behind a realm
#   they would come and go with whichever presets happen to be mounted).
#   `compaction-basic` reads `toolResultPrune` through `ctx.get`, so the pruner
#   must share this realm rather than sit outside it.
#
# * delegation: the `subagents` registry and its spawn/fork backends live in
#   the HOST composition (a process singleton whose cross-session queries the
#   api-proxy serves; a provider name may only be registered once). This preset
#   contributes the delegation TOOLS, which resolve that host registry.
#   `workflows` is different — nothing outside an agent reads it — so every
#   row that reaches it shares one entry-local realm here.
#   `tool-subagent-report` is host-plane for the same reason as the registry:
#   it registers a CONTINUABLE SETUP on that singleton rather than a tool this
#   agent calls, and the setup list is not scope-aware — one copy per mounted
#   preset means every child gets `report` registered once per live session,
#   which throws on the second.
#
# * web/present: the `web` service and its search provider, plus the
#   deliverable registry and browser surface, stay in the host composition;
#   only the model-facing tools are per-session.
#
# ── declaration ──────────────────────────────────────────────────────────────
- insert:
    - id: preset-exptech
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: exptech
        name: ExpTechTW 模式
        description: >-
          以 ExpTechTW（探索科技）公開 GitHub 組織與其公共 API 為焦點的完整編碼 Agent：
          具備標準模式全部能力，並內建組織慣例、專案地圖與可用 API 端點目錄，讓開發 ExpTech 更簡單。
        order: 10
        plugins:
          # ── identity ──
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: >-
                You are an ExpTechTW（探索科技）coding agent powered by the {{model}} model.

                You help develop ExpTech 公開專案：臺灣地震防災（DPIP / TREM）、Discord 機器人、Minecraft 插件與公共 API。回覆使用者預設用繁體中文（zh-TW）；程式碼、commit 與技術文件用英文。

                處理與 https://github.com/ExpTechTW/ 有關的工作時，先載入並遵守 `exptech-org` 技能（組織慣例、專案地圖、協作流程）；涉及公共 API 或端點時，載入 `exptech-apis` 技能（可用端點目錄與官方文件位置）。需要最新倉庫／端點資訊時，以官方文件或 GitHub API 實測為準，不要憑記憶猜測。

          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536

          # ── shell ──
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'

          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'

          # ── filesystem ──
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'

          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false

          # ── background jobs ──
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'

          # ── skills ──
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
            config:
              customSkillDirs:
                - !!js process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:path').dirname(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('dsh-exptech/package.json')), 'skills')

          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'

          # ── goals ──
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'

          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'

          # ── plan mode ──
          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: |
                    You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

                    Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

                    The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

                    Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

                    Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

                    When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.

          # ── compaction ──
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'

              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'

              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024

          # ── delegation and workflows ──
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'

              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  backgroundMode: continuable

              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork
                  backgroundMode: continuable

              # Production dsh does not install these optional providers. An
              # opting-in Profile mounts each provider once on the host plane;
              # copy this preset, then remove `disabled` from the matching row.
              - id: tool-subagent-codex
                name: '@deepseek-ai/dsh-tool-subagent'
                disabled: true
                config:
                  provider: codex
                  toolName: subagent_codex
                  backgroundMode: one-shot
                  maxDepth: provider-managed

              - id: tool-subagent-claude-code
                name: '@deepseek-ai/dsh-tool-subagent'
                disabled: true
                config:
                  provider: claude-code
                  toolName: subagent_claude_code
                  backgroundMode: one-shot
                  maxDepth: provider-managed

              # The workflow worker backend. `@deepseek-ai/dsh-workflow-ptc` is
              # the current package (the workflow registry on the host plane
              # provides the PTC runtime); the older
              # `@deepseek-ai/dsh-workflow-worker-thread` package no longer
              # ships and failed activation.
              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                config:
                  provider: spawn

              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'

              - id: tool-ralph
                name: '@deepseek-ai/dsh-tool-ralph'
                config:
                  subagentProvider: spawn
                  maxRounds: 64

          # ── remaining model-facing rows ──
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'

          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true

          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: false
              searchTimeoutMs: 60000

          - id: present
            name: '@deepseek-ai/dsh-tool-present'
